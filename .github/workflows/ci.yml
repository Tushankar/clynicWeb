name: CI

# Runs on the clynicWeb repository. The previous workflow lived at the parent folder, which is
# NOT inside this git repo, so it was never pushed and never executed. Paths are repo-relative.
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    name: Web — build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        env:
          # The build only needs these to resolve; it does not call the API.
          VITE_API_BASE_URL: http://localhost:5000
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_ci_placeholder
        run: npm run build
